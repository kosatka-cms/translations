# The translations catalog: every pull request and push checks the
# strings against the engine's (main's) - a broken one fails it, a string
# Russian hasn't translated yet is a warning (the site shows it in
# English until then); main is built
# into index.json and a <code>.json per language and published to GitHub
# Pages (Settings → Pages → Source: GitHub Actions). Built daily too: a
# string the engine dropped leaves the catalog.
name: catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: github.com/kosatka-cms/kosatka/cmd/app@main
  # The engine's main straight from GitHub (its other modules through the
  # proxy, as some of their hosts don't answer the runners): the module
  # proxy keeps answering @main with an older commit for a while, whose
  # strings lack the newest ones - the build would leave their
  # translations out as stale.
  GOPRIVATE: github.com/kosatka-cms/kosatka

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The strings themselves: a broken catalog, a placeholder lost, HTML
      # the English hasn't - an error.
      - run: go run "$APP" translations index -src . -out "$RUNNER_TEMP/check"
      # Russian complete: what it lacks is a warning, listed on the run's
      # summary - the engine's new strings wait for their translation
      # without failing the check.
      - name: Russian untranslated
        run: |
          if go run "$APP" translations index -src . -out "$RUNNER_TEMP/complete" -complete ru 2> missing.txt; then
            exit 0
          fi
          head -1 missing.txt | sed 's/^translations index: //; s/^/::warning title=Russian incomplete::/'
          {
            echo "### Russian: not translated yet"
            echo
            tail -n +2 missing.txt | sed 's/^ *//; s/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Not -complete: a string the engine added lately doesn't hold the
      # other languages back.
      - run: go run "$APP" translations index -src . -out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kosatka-cms/translations'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

# The translations catalog: every pull request and push checks the
# strings against the engine's (main's), Russian complete; main is built
# into index.json and a <code>.json per language and published to GitHub
# Pages (Settings → Pages → Source: GitHub Actions). Built daily too: a
# string the engine dropped leaves the catalog.
name: catalog

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: github.com/kosatka-cms/kosatka/cmd/app@main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run "$APP" translations index -src . -out "$RUNNER_TEMP/check" -complete ru

  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # Not -complete: a string the engine added lately doesn't hold the
      # other languages back.
      - run: go run "$APP" translations index -src . -out dist
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'kosatka-cms/translations'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
